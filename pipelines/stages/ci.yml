stages:
  - stage: CI
    displayName: CI - Test, build and scan
    jobs:
      - job: Test
        displayName: Test $(serviceName)
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: self
            clean: true
          - bash: |
              set -euo pipefail
              npm ci
              npm test
              npm run check
            displayName: Run service tests

      - job: BuildAndScan
        displayName: Docker build and Trivy scan
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: self
            clean: true
          - bash: |
              set -euo pipefail
              docker build \
                --file "$(Build.SourcesDirectory)/$(dockerfilePath)" \
                --tag "$(fullImageName)" \
                "$(Build.SourcesDirectory)"
            displayName: Build Docker image
          - bash: |
              set -euo pipefail
              mkdir -p "$(Pipeline.Workspace)/.trivy-cache"
              docker run --rm \
                --volume /var/run/docker.sock:/var/run/docker.sock \
                --volume "$(Pipeline.Workspace)/.trivy-cache:/root/.cache/" \
                aquasec/trivy:0.72.0 \
                image \
                --exit-code 1 \
                --ignore-unfixed \
                --severity HIGH,CRITICAL \
                "$(fullImageName)"
            displayName: Scan image with Trivy
          - bash: |
              set -euo pipefail
              docker save "$(fullImageName)" | gzip > "$(Build.ArtifactStagingDirectory)/container-image.tar.gz"
            displayName: Package image for publish stage
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
          - task: PublishPipelineArtifact@1
            displayName: Publish container image artifact
            condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
            inputs:
              targetPath: $(Build.ArtifactStagingDirectory)/container-image.tar.gz
              artifact: container-image
              publishLocation: pipeline

  - stage: Push_ACR
    displayName: Push image to ACR
    dependsOn: CI
    condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
    jobs:
      - job: Push
        displayName: Push immutable image tag
        pool:
          vmImage: $(vmImage)
        steps:
          - checkout: none
          - download: current
            artifact: container-image
          - bash: |
              set -euo pipefail
              gzip --decompress --stdout "$(Pipeline.Workspace)/container-image/container-image.tar.gz" | docker load
            displayName: Load tested image
          - task: Docker@2
            displayName: Login to ACR
            inputs:
              command: login
              containerRegistry: $(acrServiceConnection)
          - bash: |
              set -euo pipefail
              docker push "$(fullImageName)"
            displayName: Push $(fullImageName)
          - task: Docker@2
            displayName: Logout from ACR
            condition: always()
            inputs:
              command: logout
              containerRegistry: $(acrServiceConnection)
