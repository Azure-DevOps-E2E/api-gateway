name: nexuscart

services:
  user-service:
    build:
      context: ../user-service
    environment:
      PORT: "8081"
      GIN_MODE: release
      APP_VERSION: ${APP_VERSION:-1.0.0}
    expose:
      - "8081"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:8081/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - shop-network

  catalog-service:
    build:
      context: ../catalog-service
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - shop-network

  order-service:
    build:
      context: ../order-service
    environment:
      PORT: "8083"
      USER_SERVICE_URL: ${USER_SERVICE_URL:-http://user-service:8081}
      CATALOG_SERVICE_URL: ${CATALOG_SERVICE_URL:-http://catalog-service:8000}
      APP_VERSION: ${APP_VERSION:-1.0.0}
    expose:
      - "8083"
    depends_on:
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--output-document=-", "http://127.0.0.1:8083/health"]
      interval: 5s
      timeout: 3s
      retries: 18
      start_period: 15s
    networks:
      - shop-network

  frontend:
    build:
      context: ../frontend
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.0}
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - shop-network

  api-gateway:
    image: nginx:1.30.4-alpine3.24
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./gateway/health.html:/usr/share/nginx/html/health.html:ro
    depends_on:
      user-service:
        condition: service_healthy
      catalog-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      frontend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/gateway-health >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 3s
    networks:
      - shop-network

networks:
  shop-network:
    driver: bridge
