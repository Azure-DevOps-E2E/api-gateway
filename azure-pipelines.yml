trigger:
  batch: true
  branches:
    include:
    - feature/*
    - dev
    - main

pr: none

resources:
  repositories:
  - repository: templates
    type: github
    endpoint: github.com_Azure-DevOps-E2E
    name: Azure-DevOps-E2E/config-management
    ref: refs/heads/main

variables:
- group: nexuscart-shared
- name: serviceName
  value: 'api-gateway'
- name: imageRepository
  value: 'api-gateway'
- name: dockerfilePath
  value: '$(Build.SourcesDirectory)/Dockerfile'
- name: buildContext
  value: '$(Build.SourcesDirectory)'
- name: containerRegistryServiceConnection
  value: acrLoginServer
- name: githubReleaseConnection
  value: github.com_Azure-DevOps-E2E
- name: nodeVersion
  value: '24.x'
- name: testResultsFile
  value: '$(System.DefaultWorkingDirectory)/reports/test-results.xml'
- name: coverageSummaryFile
  value: '$(System.DefaultWorkingDirectory)/coverage/lcov.info'
- name: trivyVersion
  value: '0.72.0'
- name: candidateTag
  value: 'candidate-$(Build.SourceVersion)'
- name: releaseTag
  value: 'v1.0.$(Build.BuildId)'
- name: chartRoot
  value: '$(Pipeline.Workspace)/s/templates/deploy/helm/$(serviceName)'

pool:
  name: azure-agent

extends:
  template: pipelines/templates/pipeline-contract.yml@templates
  parameters:
    pipelineStages:
    - stage: CI
      displayName: 'CI - $(serviceName)'
      jobs:
      - job: Quality
        displayName: 'Test and build $(serviceName)'
        steps:
        - checkout: self
          clean: true
          fetchDepth: 1
          displayName: 'Checkout source code'

        - task: NodeTool@0
          displayName: 'Use Node.js $(nodeVersion)'
          inputs:
            versionSpec: '$(nodeVersion)'

        - template: steps/node/install.yml@templates

        - template: steps/node/native-test.yml@templates
          parameters:
            testResultsFile: reports/test-results.xml
            coverageFile: coverage/lcov.info

        - template: steps/node/run-scripts.yml@templates
          parameters:
            scripts:
            - check

        - task: PublishTestResults@2
          displayName: 'Publish test report'
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: JUnit
            testResultsFiles: '$(testResultsFile)'
            searchFolder: '$(System.DefaultWorkingDirectory)'
            mergeTestResults: true
            failTaskOnFailedTests: true
            failTaskOnFailureToPublishResults: true
            failTaskOnMissingResultsFile: true
            testRunTitle: '$(serviceName) tests'

        - task: PublishCodeCoverageResults@2
          displayName: 'Publish coverage report'
          condition: succeededOrFailed()
          inputs:
            summaryFileLocation: '$(coverageSummaryFile)'
            pathToSources: '$(Build.SourcesDirectory)'
            failIfCoverageEmpty: true

    - stage: BuildCandidate
      displayName: 'Build candidate - $(serviceName)'
      dependsOn: CI
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/dev'))
      jobs:
      - job: BuildImage
        displayName: 'Build, scan, and push DEV candidate'
        steps:
        - checkout: self
          clean: true
          fetchDepth: 1
          displayName: 'Checkout source code'

        - task: Docker@2
          displayName: 'Build candidate image'
          inputs:
            command: build
            containerRegistry: '$(containerRegistryServiceConnection)'
            repository: '$(imageRepository)'
            dockerfile: '$(dockerfilePath)'
            buildContext: '$(buildContext)'
            tags: |
              $(candidateTag)
              dev

        - template: steps/container/scan.yml@templates
          parameters:
            scanImage: '$(acrLoginServer)/$(imageRepository):$(candidateTag)'
            trivyVersion: '$(trivyVersion)'

        - task: Docker@2
          displayName: 'Push candidate image'
          inputs:
            command: push
            containerRegistry: '$(containerRegistryServiceConnection)'
            repository: '$(imageRepository)'
            tags: |
              $(candidateTag)
              dev

    - stage: DeployDev
      displayName: 'Deploy DEV - $(serviceName)'
      dependsOn: BuildCandidate
      condition: succeeded()
      jobs:
      - deployment: DeployDev
        displayName: 'Deploy candidate to DEV'
        environment: Development
        strategy:
          runOnce:
            deploy:
              steps:
              - checkout: templates
                clean: true
                path: s/templates
                displayName: 'Checkout deployment templates'

              - task: HelmDeploy@1
                displayName: 'Helm upgrade DEV'
                inputs:
                  connectionType: 'Azure Resource Manager'
                  azureSubscription: '$(azureServiceConnection)'
                  azureResourceGroup: '$(aksResourceGroup)'
                  kubernetesCluster: '$(aksClusterName)'
                  namespace: dev
                  command: upgrade
                  chartType: FilePath
                  chartPath: '$(chartRoot)'
                  releaseName: '$(serviceName)'
                  valueFile: '$(chartRoot)/values-dev.yaml'
                  overrideValues: |
                    image.repository=$(acrLoginServer)/$(imageRepository)
                    image.tag=$(candidateTag)
                    appVersion=$(candidateTag)
                  install: true
                  waitForExecution: true
                  arguments: '--atomic --create-namespace --timeout 10m'

    - stage: VerifyDev
      displayName: 'Verify DEV - $(serviceName)'
      dependsOn: DeployDev
      condition: succeeded()
      jobs:
      - job: VerifyDev
        displayName: 'Health and smoke test DEV'
        steps:
        - checkout: templates
          clean: true
          path: s/templates
          displayName: 'Checkout verification scripts'

        - task: PowerShell@2
          displayName: 'Wait for DEV health'
          inputs:
            targetType: filePath
            filePath: '$(Pipeline.Workspace)/s/templates/scripts/wait-health.ps1'
            arguments: '-BaseUrl "$(devBaseUrl)" -TimeoutSeconds 300 -IntervalSeconds 10'
            pwsh: true

        - task: PowerShell@2
          displayName: 'Verify DEV version'
          inputs:
            targetType: filePath
            filePath: '$(Pipeline.Workspace)/s/templates/scripts/health.ps1'
            arguments: '-BaseUrl "$(devBaseUrl)" -ExpectedService "$(serviceName)" -ExpectedVersion "$(candidateTag)"'
            pwsh: true

        - task: PowerShell@2
          displayName: 'Run DEV smoke test'
          inputs:
            targetType: filePath
            filePath: '$(Pipeline.Workspace)/s/templates/scripts/smoke.ps1'
            arguments: '-BaseUrl "$(devBaseUrl)"'
            pwsh: true

    - stage: ResolveCandidate
      displayName: 'Resolve DEV candidate - $(serviceName)'
      dependsOn: CI
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      jobs:
      - job: Resolve
        displayName: 'Validate dev-to-main promotion source'
        steps:
        - checkout: self
          clean: true
          fetchDepth: 0
          persistCredentials: true
          displayName: 'Checkout full Git history'

        - template: steps/container/resolve-candidate.yml@templates

    - stage: PromoteImage
      displayName: 'Promote image - $(serviceName)'
      dependsOn: ResolveCandidate
      condition: and(succeeded(), eq(dependencies.ResolveCandidate.outputs['Resolve.resolveCandidate.shouldPromote'], 'true'))
      variables:
      - name: candidateSourceVersion
        value: $[ stageDependencies.ResolveCandidate.Resolve.outputs['resolveCandidate.candidateSourceVersion'] ]
      jobs:
      - job: Promote
        displayName: 'Retag candidate for PROD without rebuild'
        steps:
        - checkout: none

        - task: Docker@2
          displayName: 'Sign in to ACR'
          inputs:
            command: login
            containerRegistry: '$(containerRegistryServiceConnection)'

        - template: steps/container/promote.yml@templates
          parameters:
            registry: '$(acrLoginServer)'
            repository: '$(imageRepository)'
            candidateTag: 'candidate-$(candidateSourceVersion)'
            releaseTag: '$(releaseTag)'

        - task: Docker@2
          displayName: 'Sign out of ACR'
          condition: always()
          inputs:
            command: logout
            containerRegistry: '$(containerRegistryServiceConnection)'

    - stage: DeployProd
      displayName: 'Deploy PROD - $(serviceName)'
      dependsOn: PromoteImage
      condition: succeeded()
      jobs:
      - deployment: DeployProd
        displayName: 'Deploy promoted image to PROD'
        environment: Production
        strategy:
          runOnce:
            deploy:
              steps:
              - checkout: templates
                clean: true
                path: s/templates
                displayName: 'Checkout deployment templates'

              - task: HelmDeploy@1
                displayName: 'Helm upgrade PROD'
                inputs:
                  connectionType: 'Azure Resource Manager'
                  azureSubscription: '$(azureServiceConnection)'
                  azureResourceGroup: '$(aksResourceGroup)'
                  kubernetesCluster: '$(aksClusterName)'
                  namespace: prod
                  command: upgrade
                  chartType: FilePath
                  chartPath: '$(chartRoot)'
                  releaseName: '$(serviceName)'
                  valueFile: '$(chartRoot)/values-prod.yaml'
                  overrideValues: |
                    image.repository=$(acrLoginServer)/$(imageRepository)
                    image.tag=$(releaseTag)
                    appVersion=$(releaseTag)
                  install: true
                  waitForExecution: true
                  arguments: '--atomic --create-namespace --timeout 10m'

    - stage: VerifyProd
      displayName: 'Verify PROD - $(serviceName)'
      dependsOn: DeployProd
      condition: succeeded()
      jobs:
      - job: VerifyProd
        displayName: 'Health and smoke test PROD'
        steps:
        - checkout: templates
          clean: true
          path: s/templates
          displayName: 'Checkout verification scripts'

        - task: PowerShell@2
          displayName: 'Wait for PROD health'
          inputs:
            targetType: filePath
            filePath: '$(Pipeline.Workspace)/s/templates/scripts/wait-health.ps1'
            arguments: '-BaseUrl "$(prodBaseUrl)" -TimeoutSeconds 300 -IntervalSeconds 10'
            pwsh: true

        - task: PowerShell@2
          displayName: 'Verify PROD version'
          inputs:
            targetType: filePath
            filePath: '$(Pipeline.Workspace)/s/templates/scripts/health.ps1'
            arguments: '-BaseUrl "$(prodBaseUrl)" -ExpectedService "$(serviceName)" -ExpectedVersion "$(releaseTag)"'
            pwsh: true

        - task: PowerShell@2
          displayName: 'Run PROD smoke test'
          inputs:
            targetType: filePath
            filePath: '$(Pipeline.Workspace)/s/templates/scripts/smoke.ps1'
            arguments: '-BaseUrl "$(prodBaseUrl)"'
            pwsh: true

    - stage: Release
      displayName: 'GitHub release - $(serviceName)'
      dependsOn:
      - VerifyProd
      - PromoteImage
      - ResolveCandidate
      condition: succeeded()
      variables:
      - name: promotedImageDigest
        value: $[ stageDependencies.PromoteImage.Promote.outputs['promoteImage.promotedImageDigest'] ]
      - name: candidateSourceVersion
        value: $[ stageDependencies.ResolveCandidate.Resolve.outputs['resolveCandidate.candidateSourceVersion'] ]
      jobs:
      - job: GitHubRelease
        displayName: 'Create Git tag and GitHub Release'
        steps:
        - checkout: none

        - task: GitHubRelease@1
          displayName: 'Create $(releaseTag)'
          inputs:
            gitHubConnection: '$(githubReleaseConnection)'
            repositoryName: '$(Build.Repository.Name)'
            action: create
            target: '$(Build.SourceVersion)'
            tagSource: userSpecifiedTag
            tag: '$(releaseTag)'
            title: '$(serviceName) $(releaseTag)'
            releaseNotesSource: inline
            releaseNotesInline: |
              Production deployment completed successfully.

              - Image: `$(acrLoginServer)/$(imageRepository):$(releaseTag)`
              - Digest: `$(promotedImageDigest)`
              - DEV candidate commit: `$(candidateSourceVersion)`
              - PROD commit: `$(Build.SourceVersion)`
            isDraft: false
            isPreRelease: false
            makeLatest: true
            addChangeLog: true
            changeLogCompareToRelease: lastFullRelease
            changeLogType: commitBased
