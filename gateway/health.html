<!doctype html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>NexusCart - Service Health</title>
    <style>
        :root {
            color-scheme: dark;
            font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #07111f;
            color: #e5edf7;
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            padding: 48px 20px;
            background:
                radial-gradient(circle at top left, rgba(20, 184, 166, 0.16), transparent 34rem),
                radial-gradient(circle at bottom right, rgba(59, 130, 246, 0.14), transparent 32rem),
                #07111f;
        }

        main { width: min(960px, 100%); margin: 0 auto; }

        header {
            display: flex;
            align-items: flex-end;
            justify-content: space-between;
            gap: 24px;
            margin-bottom: 28px;
        }

        .eyebrow {
            margin: 0 0 8px;
            color: #5eead4;
            font-size: 0.75rem;
            font-weight: 800;
            letter-spacing: 0.14em;
            text-transform: uppercase;
        }

        h1 {
            margin: 0;
            font-size: clamp(2rem, 6vw, 3.6rem);
            line-height: 1;
        }

        .subtitle { margin: 14px 0 0; color: #94a3b8; }

        button {
            border: 1px solid #334155;
            border-radius: 10px;
            padding: 10px 16px;
            background: #0f1d30;
            color: #e5edf7;
            cursor: pointer;
            font: inherit;
            font-weight: 700;
        }

        button:hover { border-color: #5eead4; }
        button:disabled { cursor: wait; opacity: 0.65; }

        .summary {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            padding: 14px 16px;
            border: 1px solid #243247;
            border-radius: 12px;
            background: rgba(15, 29, 48, 0.82);
        }

        .summary p { margin: 3px 0 0; color: #94a3b8; font-size: 0.875rem; }

        .summary-dot,
        .status-dot {
            flex: 0 0 auto;
            width: 10px;
            height: 10px;
            border-radius: 999px;
            background: #64748b;
            box-shadow: 0 0 0 4px rgba(100, 116, 139, 0.14);
        }

        .summary.up .summary-dot,
        .card.up .status-dot {
            background: #34d399;
            box-shadow: 0 0 0 4px rgba(52, 211, 153, 0.14);
        }

        .summary.down .summary-dot,
        .card.down .status-dot {
            background: #fb7185;
            box-shadow: 0 0 0 4px rgba(251, 113, 133, 0.14);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 14px;
        }

        .card {
            min-height: 148px;
            padding: 20px;
            border: 1px solid #243247;
            border-radius: 14px;
            background: rgba(11, 24, 41, 0.9);
        }

        .card-head { display: flex; align-items: center; gap: 10px; }
        .card h2 { margin: 0; font-size: 1rem; }
        .status { margin: 22px 0 6px; font-size: 1.45rem; font-weight: 800; }
        .meta { margin: 0; color: #94a3b8; font-size: 0.85rem; }
        .error { color: #fda4af; }
        footer { margin-top: 22px; color: #64748b; font-size: 0.82rem; }

        @media (max-width: 640px) {
            body { padding-top: 30px; }
            header { align-items: flex-start; flex-direction: column; }
        }
    </style>
</head>
<body>
<main>
    <header>
        <div>
            <p class="eyebrow">System status</p>
            <h1>Service health</h1>
            <p class="subtitle">Trạng thái và phiên bản đang chạy của toàn bộ hệ thống.</p>
        </div>
        <button id="refresh" type="button">Kiểm tra lại</button>
    </header>

    <section id="summary" class="summary" aria-live="polite">
        <span class="summary-dot" aria-hidden="true"></span>
        <div>
            <strong id="summary-title">Đang kiểm tra service...</strong>
            <p id="summary-detail">Trang tự cập nhật mỗi 10 giây.</p>
        </div>
    </section>

    <section id="services" class="grid" aria-label="Trạng thái service"></section>
    <footer id="updated">Đang chờ kết quả health check đầu tiên...</footer>
</main>

<script>
    const services = [
        { name: 'API Gateway', id: 'api-gateway', url: '/health/api-gateway' },
        { name: 'Frontend', id: 'frontend', url: '/health/frontend' },
        { name: 'User Service', id: 'user-service', url: '/health/user-service' },
        { name: 'Catalog Service', id: 'catalog-service', url: '/health/catalog-service' },
        { name: 'Order Service', id: 'order-service', url: '/health/order-service' }
    ];

    const serviceGrid = document.querySelector('#services');
    const summary = document.querySelector('#summary');
    const summaryTitle = document.querySelector('#summary-title');
    const summaryDetail = document.querySelector('#summary-detail');
    const updated = document.querySelector('#updated');
    const refreshButton = document.querySelector('#refresh');

    function createCard(service) {
        const article = document.createElement('article');
        article.className = 'card';
        article.dataset.service = service.id;
        article.innerHTML =
            '<div class="card-head">' +
                '<span class="status-dot" aria-hidden="true"></span>' +
                '<h2></h2>' +
            '</div>' +
            '<p class="status">CHECKING</p>' +
            '<p class="meta">Version: —</p>';
        article.querySelector('h2').textContent = service.name;
        return article;
    }

    services.forEach(function (service) {
        serviceGrid.appendChild(createCard(service));
    });

    async function checkService(service) {
        const startedAt = performance.now();
        const controller = new AbortController();
        const timeout = setTimeout(function () { controller.abort(); }, 4000);

        try {
            const response = await fetch(service.url, {
                cache: 'no-store',
                headers: { Accept: 'application/json' },
                signal: controller.signal
            });
            const payload = await response.json();
            const isUp = response.ok && payload.status === 'UP';

            return {
                name: service.name,
                id: service.id,
                isUp: isUp,
                status: isUp ? 'UP' : 'DOWN',
                version: payload.version || 'unknown',
                latency: Math.round(performance.now() - startedAt),
                error: isUp ? '' : 'HTTP ' + response.status
            };
        } catch (error) {
            return {
                name: service.name,
                id: service.id,
                isUp: false,
                status: 'DOWN',
                version: 'unknown',
                latency: Math.round(performance.now() - startedAt),
                error: error.name === 'AbortError' ? 'Request timed out' : 'Service unavailable'
            };
        } finally {
            clearTimeout(timeout);
        }
    }

    function renderResult(result) {
        const card = document.querySelector('[data-service="' + result.id + '"]');
        card.className = 'card ' + (result.isUp ? 'up' : 'down');
        card.querySelector('.status').textContent = result.status;

        const meta = card.querySelector('.meta');
        meta.className = 'meta' + (result.isUp ? '' : ' error');
        meta.textContent = result.isUp
            ? 'Version ' + result.version + ' · ' + result.latency + ' ms'
            : result.error + ' · Version ' + result.version;
    }

    async function refresh() {
        refreshButton.disabled = true;
        const results = await Promise.all(services.map(checkService));
        results.forEach(renderResult);

        const upCount = results.filter(function (result) { return result.isUp; }).length;
        const allUp = upCount === results.length;
        summary.className = 'summary ' + (allUp ? 'up' : 'down');
        summaryTitle.textContent = allUp
            ? 'Tất cả service đang hoạt động'
            : upCount + '/' + results.length + ' service đang hoạt động';
        summaryDetail.textContent = allUp
            ? 'Mọi health endpoint đều phản hồi thành công.'
            : 'Có service cần được kiểm tra.';
        updated.textContent =
            'Kiểm tra lần cuối: ' + new Date().toLocaleString('vi-VN') +
            ' · Tự cập nhật mỗi 10 giây';
        refreshButton.disabled = false;
    }

    refreshButton.addEventListener('click', refresh);
    refresh();
    setInterval(refresh, 10000);
</script>
</body>
</html>
