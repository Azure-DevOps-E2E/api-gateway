worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format gateway '$remote_addr - $request_id [$time_local] "$request" '
                       '$status $body_bytes_sent "$http_user_agent"';
    access_log /var/log/nginx/access.log gateway;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    keepalive_timeout 30;
    server_tokens off;

    upstream frontend_upstream {
        server frontend:80;
        keepalive 16;
    }

    upstream user_upstream {
        server user-service:8081;
        keepalive 16;
    }

    upstream catalog_upstream {
        server catalog-service:8000;
        keepalive 16;
    }

    upstream order_upstream {
        server order-service:8083;
        keepalive 16;
    }

    server {
        listen 80;
        server_name _;
        client_max_body_size 1m;

        add_header X-Request-ID $request_id always;

        location = /gateway-health {
            access_log off;
            default_type application/json;
            return 200 '{"status":"UP","service":"api-gateway"}';
        }

        location ~ ^/api/v1/users(?:/|$) {
            proxy_pass http://user_upstream;
            proxy_hide_header X-Request-ID;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        location ~ ^/api/v1/products(?:/|$) {
            proxy_pass http://catalog_upstream;
            proxy_hide_header X-Request-ID;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }

        location ~ ^/api/v1/orders(?:/|$) {
            proxy_pass http://order_upstream;
            proxy_hide_header X-Request-ID;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 10s;
        }

        location /api/ {
            default_type application/json;
            return 404 '{"error":{"code":"ROUTE_NOT_FOUND","message":"API route does not exist","requestId":"$request_id"}}';
        }

        location / {
            proxy_pass http://frontend_upstream;
            proxy_hide_header X-Request-ID;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Request-ID $request_id;
            proxy_connect_timeout 3s;
            proxy_read_timeout 5s;
        }
    }
}
