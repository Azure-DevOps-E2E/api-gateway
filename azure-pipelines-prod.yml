trigger:
  batch: true
  branches:
    include:
    - main

pr: none

parameters:
- name: releaseTag
  displayName: 'Release Git tag'
  type: string
  default: 'v1.0.$(Build.BuildId)'

resources:
  repositories:
  - repository: templates
    type: github
    endpoint: github.com_Azure-DevOps-E2E
    name: Azure-DevOps-E2E/config-management
    ref: refs/heads/main

variables:
- group: nexuscart-shared
- name: serviceName
  value: 'api-gateway'
- name: imageRepository
  value: 'api-gateway'
- name: nodeVersion
  value: '24.x'
- name: testResultsFile
  value: '$(System.DefaultWorkingDirectory)/reports/test-results.xml'
- name: coverageSummaryFile
  value: '$(System.DefaultWorkingDirectory)/coverage/lcov.info'
- name: releaseTag
  value: ${{ parameters.releaseTag }}

pool:
  name: azure-agent

extends:
  template: pipelines/templates/pipeline-contract.yml@templates
  parameters:
    pipelineStages:
    - stage: CI
      displayName: 'CI - $(serviceName)'
      jobs:
      - job: Quality
        displayName: 'Test and build $(serviceName)'
        steps:
        - checkout: self
          clean: true
          fetchDepth: 1
          displayName: 'Checkout source code'

        # Host Node.js setup is kept commented for rollback. Quality now runs in Docker.
        # - task: NodeTool@0
        #   displayName: 'Use Node.js $(nodeVersion)'
        #   inputs:
        #     versionSpec: '$(nodeVersion)'
        #
        # - template: steps/node/install.yml@templates
        #
        # - template: steps/node/native-test.yml@templates
        #   parameters:
        #     testResultsFile: reports/test-results.xml
        #     coverageFile: coverage/lcov.info
        #
        # - template: steps/node/run-scripts.yml@templates
        #   parameters:
        #     scripts:
        #     - check

        - template: steps/container/prepare-build-image.yml@templates
          parameters:
            runtime: node
            version: '$(nodeVersion)'

        - template: steps/node/native-quality-container.yml@templates
          parameters:
            cacheKey: '$(serviceName)-node$(nodeVersion)'
            testResultsFile: reports/test-results.xml
            coverageFile: coverage/lcov.info

        - task: PublishTestResults@2
          displayName: 'Publish test report'
          condition: succeededOrFailed()
          inputs:
            testResultsFormat: JUnit
            testResultsFiles: '$(testResultsFile)'
            searchFolder: '$(System.DefaultWorkingDirectory)'
            mergeTestResults: true
            failTaskOnFailedTests: true
            failTaskOnFailureToPublishResults: true
            failTaskOnMissingResultsFile: true
            testRunTitle: '$(serviceName) tests'

        - task: UseDotNet@2
          displayName: 'Use .NET SDK for coverage publisher'
          condition: succeededOrFailed()
          inputs:
            packageType: sdk
            version: '8.x'

        - task: PublishCodeCoverageResults@2
          displayName: 'Publish coverage report'
          condition: succeededOrFailed()
          inputs:
            summaryFileLocation: '$(coverageSummaryFile)'
            pathToSources: '$(Build.SourcesDirectory)'
            failIfCoverageEmpty: true

    - stage: ResolveCandidate
      displayName: 'Resolve DEV candidate - $(serviceName)'
      dependsOn: CI
      condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
      jobs:
      - job: Resolve
        displayName: 'Validate dev-to-main promotion source'
        steps:
        - checkout: self
          clean: true
          fetchDepth: 0
          persistCredentials: true
          displayName: 'Checkout full Git history'

        - template: steps/container/resolve-candidate.yml@templates

    - stage: ValidateReleaseTag
      displayName: 'Validate release tag - $(serviceName)'
      dependsOn: ResolveCandidate
      condition: and(succeeded(), eq(dependencies.ResolveCandidate.outputs['Resolve.resolveCandidate.shouldPromote'], 'true'))
      jobs:
      - job: ValidateTag
        displayName: 'Require an existing release Git tag'
        steps:
        - checkout: self
          clean: true
          fetchDepth: 1
          persistCredentials: true
          displayName: 'Checkout source for tag validation'

        - template: steps/validate-release-tag.yml@templates
          parameters:
            releaseTag: '$(releaseTag)'
            autoCreate: false
            waitIfMissing: true
            timeoutMinutes: 30
    - stage: PromoteImage
      displayName: 'Promote image - $(serviceName)'
      dependsOn:
      - ResolveCandidate
      - ValidateReleaseTag
      condition: and(succeeded(), eq(dependencies.ResolveCandidate.outputs['Resolve.resolveCandidate.shouldPromote'], 'true'))
      variables:
      - name: candidateSourceVersion
        value: $[ stageDependencies.ResolveCandidate.Resolve.outputs['resolveCandidate.candidateSourceVersion'] ]
      jobs:
      - job: Promote
        displayName: 'Retag candidate for PROD without rebuild'
        steps:
        - checkout: none

        - bash: |
            set -euo pipefail
            if [[ ! "$(releaseTag)" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "releaseTag must match v<major>.<minor>.<patch>, for example v1.0.119"
              exit 1
            fi
          displayName: 'Validate release tag'

        - task: Docker@2
          displayName: 'Sign in to ACR'
          inputs:
            command: login
            containerRegistry: 'acrLoginServer'

        - template: steps/container/promote.yml@templates
          parameters:
            registry: '$(acrLoginServer)'
            repository: '$(imageRepository)'
            candidateTag: 'candidate-$(candidateSourceVersion)'
            releaseTag: '$(releaseTag)'

        - task: Docker@2
          displayName: 'Sign out of ACR'
          condition: always()
          inputs:
            command: logout
            containerRegistry: 'acrLoginServer'

    # Updating the Production manifest is the deployment boundary while direct
    # AKS deployment and runtime verification remain disabled.
    - stage: UpdateManifest
      displayName: 'Update PROD manifest - $(serviceName)'
      dependsOn: PromoteImage
      condition: succeeded()
      jobs:
      - deployment: UpdateManifest
        displayName: 'Commit release tag to PROD values'
        environment: Production
        strategy:
          runOnce:
            deploy:
              steps:
              - checkout: templates
                clean: true
                fetchDepth: 0
                persistCredentials: true
                path: s/templates
                displayName: 'Checkout writable config repository'

              - bash: |
                  set -euo pipefail
                  bash "$(Pipeline.Workspace)/s/templates/scripts/update-manifest.sh" \
                    --service-name "$(serviceName)" \
                    --environment prod \
                    --registry "$(acrLoginServer)" \
                    --image-tag "$(releaseTag)" \
                    --repository-root "$(Pipeline.Workspace)/s/templates"
                name: updateManifest
                displayName: 'Update and push PROD manifest'

    - stage: Release
      displayName: 'GitHub release - $(serviceName)'
      dependsOn:
      - UpdateManifest
      - PromoteImage
      - ResolveCandidate
      condition: succeeded()
      variables:
      - name: promotedImageDigest
        value: $[ stageDependencies.PromoteImage.Promote.outputs['promoteImage.promotedImageDigest'] ]
      - name: candidateSourceVersion
        value: $[ stageDependencies.ResolveCandidate.Resolve.outputs['resolveCandidate.candidateSourceVersion'] ]
      jobs:
      - job: GitHubRelease
        displayName: 'Create GitHub Release'
        steps:
        - checkout: self
          clean: true
          fetchDepth: 0
          persistCredentials: true
          displayName: 'Checkout source for release creation'

        - template: steps/create-github-release.yml@templates
